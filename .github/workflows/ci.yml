name: CI
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # pip learned --group in 25.1, and the runner's setuptools has known CVEs.
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e . --group dev
      - run: python evals/hooks/mr_guard.py
      - run: python -m ruff check src tests evals
      - run: python -m mypy src evals/hooks/mr_guard.py
      # A test stuck for 60 s dumps every thread's stack to the log.
      - run: python -m pytest -o faulthandler_timeout=60
      - run: python -m bandit -c pyproject.toml -r src
      - run: python -m pip_audit
  publish:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
