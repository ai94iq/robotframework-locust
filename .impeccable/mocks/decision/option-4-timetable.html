<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio - Timetable Slide Rack</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Bell Gothic','Segoe UI',sans-serif;background:#d4a017;color:#1a1a1a;height:900px;overflow:hidden;position:relative}
  .bed{position:absolute;inset:0;background:#d4a017}
  .rack{position:absolute;top:80px;left:40px;right:40px;height:740px;display:flex;gap:12px;transform:skewY(-6deg);transform-origin:left center}
  .slide{flex:1;background:rgba(255,255,255,.85);border:1px solid #1a1a1a;padding:16px;position:relative;backdrop-filter:blur(2px)}
  .slide h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .slide .code{font-family:'Consolas',monospace;font-size:11px;background:#1a1a1a;color:#d4a017;padding:2px 6px;display:inline-block;margin-bottom:8px}
  .slide p{font-size:12px;line-height:1.5}
  .slide .accent{color:#c0392b;font-weight:700}
  header{position:absolute;top:0;left:0;right:0;height:64px;background:rgba(0,0,0,.85);color:#d4a017;display:flex;align-items:center;padding:0 24px;gap:16px;z-index:2}
  header h1{font-size:16px;font-weight:700;letter-spacing:2px}
  .tick{position:absolute;bottom:20px;left:40px;right:40px;height:6px;background:rgba(0,0,0,.3);z-index:2}
  .tick .pos{position:absolute;left:30%;width:8%;height:100%;background:#c0392b}
</style>
</head>
<body>
<div class="bed"></div>
<header><h1>robotframework-locust studio</h1><span style="margin-left:auto;font-size:12px">Build / Run / Report</span></header>
<div class="rack">
  <div class="slide"><span class="code">CHK-01</span><h3>Checkout Flow</h3><p>GET /home<br>POST /checkout<br>GET /search</p><p class="accent">50 users / 60s</p></div>
  <div class="slide"><span class="code">API-02</span><h3>API Smoke</h3><p>GET /health<br>GET /users</p><p class="accent">10 users / 30s</p></div>
  <div class="slide"><span class="code">SRH-03</span><h3>Search Load</h3><p>GET /search?q=foo</p><p class="accent">100 users / 120s</p></div>
  <div class="slide"><span class="code">MET-04</span><h3>Metrics</h3><p>RPS 1,248<br>p95 142ms<br>Fails 0</p><p class="accent">OK</p></div>
</div>
<div class="tick"><div class="pos"></div></div>
</body>
</html>
