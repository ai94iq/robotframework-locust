<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio - Streaming Catalog</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;height:900px;overflow:hidden}
  header{padding:20px 32px;display:flex;align-items:center;gap:16px}
  header h1{font-size:20px;font-weight:700}
  header .tabs{display:flex;gap:8px;margin-left:24px}
  header .tabs button{background:#1a1a1a;border:none;color:#888;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer}
  header .tabs button.active{background:#e50914;color:#fff}
  .row{padding:0 32px 24px}
  .row h2{font-size:16px;font-weight:600;margin-bottom:12px}
  .tiles{display:flex;gap:12px;overflow:hidden}
  .tile{flex:0 0 180px;aspect-ratio:2/3;background:#222;border-radius:8px;position:relative;overflow:hidden;transition:transform .2s}
  .tile:hover{transform:scale(1.08);z-index:2}
  .tile.focused{transform:scale(1.15);box-shadow:0 0 0 3px #e50914}
  .tile .meta{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.9));font-size:12px;opacity:0;transition:opacity .2s}
  .tile.focused .meta{opacity:1}
  .tile .meta b{display:block;font-size:13px}
  .dash{padding:0 32px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .d{background:#1a1a1a;border-radius:8px;padding:16px}
  .d .l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888}
  .d .v{font-size:24px;font-weight:700;margin-top:4px;font-family:monospace}
  .d .v.ok{color:#22c55e}
</style>
</head>
<body>
<header><h1>robotframework-locust studio</h1><div class="tabs"><button class="active">Build</button><button>Run</button><button>Report</button></div></header>
<div class="row"><h2>Scenarios</h2><div class="tiles">
  <div class="tile focused" style="background:linear-gradient(135deg,#2563eb,#1e3a8a)"><div class="meta"><b>Checkout Flow</b>50 users / 60s</div></div>
  <div class="tile" style="background:linear-gradient(135deg,#dc2626,#7f1d1d)"><div class="meta"><b>API Smoke</b>10 users / 30s</div></div>
  <div class="tile" style="background:linear-gradient(135deg,#16a34a,#14532d)"><div class="meta"><b>Search Load</b>100 users / 120s</div></div>
  <div class="tile" style="background:linear-gradient(135deg,#9333ea,#581c87)"><div class="meta"><b>Metrics</b>Live</div></div>
</div></div>
<div class="dash">
  <div class="d"><div class="l">RPS</div><div class="v ok">1,248</div></div>
  <div class="d"><div class="l">p95 (ms)</div><div class="v ok">142</div></div>
  <div class="d"><div class="l">Failures</div><div class="v ok">0</div></div>
  <div class="d"><div class="l">Users</div><div class="v">50/50</div></div>
</div>
<div class="row"><h2>Endpoints</h2><div style="background:#1a1a1a;border-radius:8px;padding:16px;font-family:monospace;font-size:12px">
  <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #333;color:#888"><span>Name</span><span>Reqs</span><span>Fails</span><span>Avg</span><span>p95</span><span>RPS</span></div>
  <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:8px;padding:8px 0"><span>GET /home</span><span>4210</span><span>0</span><span>48</span><span>92</span><span>70.2</span></div>
  <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:8px;padding:8px 0"><span>POST /checkout</span><span>2804</span><span>0</span><span>112</span><span>248</span><span>46.7</span></div>
  <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:8px;padding:8px 0"><span>GET /search</span><span>1402</span><span>2</span><span>64</span><span>128</span><span>23.4</span></div>
</div></div>
</body>
</html>
