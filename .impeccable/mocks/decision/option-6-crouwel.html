<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio - Crouwel Grid</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Helvetica Neue',sans-serif;background:#fff;color:#000;height:900px;overflow:hidden;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:60px repeat(8,1fr);gap:0}
  .cell{border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999}
  .big{grid-column:1/7;grid-row:2/6;background:#000;color:#fff;font-size:72px;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:-4px}
  .big2{grid-column:7/13;grid-row:2/4;background:#ff0000;color:#fff;font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .metric{grid-column:7/10;grid-row:4/6;background:#f0f0f0;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .metric .v{font-size:32px;margin-top:4px}
  .metric2{grid-column:10/13;grid-row:4/6;background:#f0f0f0;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .metric2 .v{font-size:32px;margin-top:4px}
  .hdr{grid-column:1/13;grid-row:1/2;background:#000;color:#fff;display:flex;align-items:center;padding:0 20px;font-size:14px;font-weight:700;letter-spacing:2px}
  .foot{grid-column:1/13;grid-row:9/10;background:#f0f0f0;display:flex;align-items:center;padding:0 20px;font-size:11px;color:#666}
  .side{grid-column:1/4;grid-row:6/9;background:#fff;display:flex;flex-direction:column;padding:12px;gap:4px;font-size:12px}
  .side div{padding:6px;border:1px solid #e0e0e0}
  .main{grid-column:4/13;grid-row:6/9;background:#fff;padding:12px;font-size:12px;overflow:auto}
  .main table{width:100%;border-collapse:collapse}
  .main th,.main td{border:1px solid #e0e0e0;padding:6px;text-align:left}
</style>
</head>
<body>
<div class="hdr">robotframework-locust studio</div>
<div class="big">LOCUST</div>
<div class="big2">RUN</div>
<div class="metric"><div>RPS</div><div class="v">1248</div></div>
<div class="metric2"><div>p95</div><div class="v">142</div></div>
<div class="side">
  <div>Checkout Flow</div><div>API Smoke</div><div>Search Load</div>
  <div>GET /home</div><div>POST /checkout</div>
</div>
<div class="main">
  <table><tr><th>Name</th><th>Reqs</th><th>Fails</th><th>p95</th><th>RPS</th></tr>
  <tr><td>GET /home</td><td>4210</td><td>0</td><td>92</td><td>70.2</td></tr>
  <tr><td>POST /checkout</td><td>2804</td><td>0</td><td>248</td><td>46.7</td></tr>
  <tr><td>GET /search</td><td>1402</td><td>2</td><td>128</td><td>23.4</td></tr></table>
</div>
<div class="foot">Build / Run / Report - grid specimen</div>
</body>
</html>
