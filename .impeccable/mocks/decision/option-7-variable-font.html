<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio - Variable Font Specimen</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#fafaf7;color:#1a1a1a;height:900px;overflow:hidden;padding:32px;display:grid;grid-template-rows:auto 1fr auto;gap:24px}
  header{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid #e0e0e0;padding-bottom:16px}
  header h1{font-size:48px;font-weight:300;font-variation-settings:'wght' 300;letter-spacing:-2px}
  header .sub{font-family:monospace;font-size:12px;color:#666}
  .sliders{display:flex;gap:24px;margin-top:8px}
  .sliders label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666;display:block;margin-bottom:4px}
  .sliders input{width:160px}
  .main{display:grid;grid-template-columns:1fr 320px;gap:24px}
  .glyphs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-content:start}
  .glyph{aspect-ratio:1;background:#fff;border:1px solid #e0e0e0;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:400}
  .side{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:20px}
  .side h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:12px}
  .stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
  .stat .v{font-family:monospace;font-weight:600}
  .stat .v.ok{color:#16a34a}
  footer{font-family:monospace;font-size:11px;color:#999;display:flex;gap:24px}
</style>
</head>
<body>
<header>
  <h1>robotframework-locust</h1>
  <span class="sub">studio / variable font specimen</span>
  <div class="sliders" style="margin-left:auto">
    <div><label>Weight</label><input type="range" min="100" max="900" value="400"></div>
    <div><label>Width</label><input type="range" min="75" max="125" value="100"></div>
  </div>
</header>
<div class="main">
  <div class="glyphs">
    <div class="glyph">A</div><div class="glyph">B</div><div class="glyph">C</div><div class="glyph">D</div>
    <div class="glyph">E</div><div class="glyph">F</div><div class="glyph">G</div><div class="glyph">H</div>
    <div class="glyph">I</div><div class="glyph">J</div><div class="glyph">K</div><div class="glyph">L</div>
    <div class="glyph">M</div><div class="glyph">N</div><div class="glyph">O</div><div class="glyph">P</div>
  </div>
  <div class="side">
    <h3>Live stats</h3>
    <div class="stat"><span>RPS</span><span class="v ok">1,248</span></div>
    <div class="stat"><span>p95 (ms)</span><span class="v ok">142</span></div>
    <div class="stat"><span>Failures</span><span class="v ok">0</span></div>
    <div class="stat"><span>Users</span><span class="v">50/50</span></div>
    <h3 style="margin-top:20px">Endpoints</h3>
    <div class="stat"><span>GET /home</span><span class="v">70.2</span></div>
    <div class="stat"><span>POST /checkout</span><span class="v">46.7</span></div>
    <div class="stat"><span>GET /search</span><span class="v">23.4</span></div>
  </div>
</div>
<footer><span>wght 400</span><span>wdth 100</span><span>size 13px</span><span>Build / Run / Report</span></footer>
</body>
</html>
